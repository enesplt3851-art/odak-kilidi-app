name: Derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "KEYSTORE_BASE64 secret'i eksik!"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/odak.p12"

      - name: APK derle
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/odak.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Dosyaları hazırla
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/OdakKilidi.apk
          cd windows && zip -r ../out/OdakKilidi-Windows.zip . && cd ..

      - name: Sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Odak Kilidi v${{ github.run_number }}
          files: out/*
